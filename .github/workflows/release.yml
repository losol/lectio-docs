name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # version branch and release tags
  pull-requests: write # open the version PR
  id-token: write # OIDC for npm trusted publishing

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    # npm trusted publishing — no NPM_TOKEN anywhere. The changesets action
    # never writes an .npmrc, so pnpm exchanges this job's OIDC token for a
    # short-lived credential; provenance comes with it.
    #
    # One-time bootstrap per NEW package: npm cannot configure a trusted
    # publisher for a name that does not exist yet, so a package's first
    # release is published manually, then its trusted publisher is set to this
    # repo + release.yml (+ this environment). The environment also carries the
    # main-only deployment branch restriction — set in repo settings.
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changesets compares against the base branch, so it needs history.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pending changesets become a "version packages" PR. Once that PR is
      # merged there is nothing pending, and the same step publishes instead:
      # topologically ordered, tagged per package, and — since
      # create-github-releases defaults to true — released on GitHub as well.
      #
      # `release` builds before publishing, per the action's own guidance:
      # changeset publish ships whatever is on disk. No registry-url on
      # setup-node and no token in env — publishing rides on OIDC.
      #
      # Action v2 requires @changesets/cli v3 and fails outright on v2. It
      # finds what was published through the CHANGESETS_OUTPUT file rather
      # than stdout; `pnpm release` passes the env through to changeset
      # publish, so tags and GitHub releases still work. The GitHub token
      # comes from the github-token input (default: github.token), not from
      # a GITHUB_TOKEN env var, and release commits and tags are pushed
      # through the GitHub API.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
