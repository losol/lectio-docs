name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the job only needs to check the repo out.
permissions:
  contents: read

jobs:
  build:
    name: Build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pinned version from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Topological: lectio-docs -> lectio-docs-react -> lectio-docs (app).
      # The app's build also runs `collect`, so this exercises the whole
      # docs pipeline: collect -> manifest -> search index -> prerender.
      - run: pnpm -r build

      - run: pnpm --filter lectio-docs typecheck

      # Dogfood the packaged CLI: build examples/quickstart with `lectio build`
      # exactly as a consumer would. The demo build above exercises the app; this
      # exercises the bin (collect -> materialize -> prerender -> static output),
      # so a change that breaks materialization turns CI red here. The nested
      # page and content grep guard against an empty build passing on the SPA
      # fallback index.html alone.
      - name: Build examples/quickstart with the lectio CLI
        working-directory: examples/quickstart
        run: |
          node "$GITHUB_WORKSPACE/apps/site-builder/bin/lectio.mjs" build
          test -f dist/index.html
          test -f dist/guides/writing-docs/index.html
          test -f dist/search-index.json
          grep -q "Quickstart" dist/index.html
